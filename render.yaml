services:
  - type: web
    name: scenario-generator-api
    runtime: python
    # Free plan: no persistent disk, so the SQLite db and trained models reset on every
    # restart/redeploy. For lasting data use `plan: starter` and add a disk mounted at
    # /opt/render/project/src/backend/data.
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.14
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        sync: false          # set to the static site URL, e.g. https://scenario-generator.onrender.com
      - key: ANTHROPIC_API_KEY
        sync: false          # optional

  - type: web
    name: scenario-generator
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite        # SPA routing
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false          # e.g. https://scenario-generator-api.onrender.com/api/v1
